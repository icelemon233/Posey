name: posey
description: Posey - Flutter 姿势参考相机
publish_to: none
version: 0.2.1+3
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.1
  gal: 2.3.3
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  image: 4.12.0
  image_picker: 1.2.4
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  uuid: 4.6.0
  flutter_svg: 2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - assets/data/
    - assets/demo/
    - assets/pose-guides/
    - assets/poses/
    - assets/showcase/
    - assets/themes/
