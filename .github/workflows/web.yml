name: Web demo

on:
  push:
    branches: [main]
    paths: ['web/**', 'package.json', 'package-lock.json', 'scripts/write-web-build-marker.mjs', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'package.json', 'package-lock.json', 'scripts/write-web-build-marker.mjs', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - name: Build web demo
        env:
          POSEY_PUBLIC_BASE: /posey/
        run: npm run build:web
      - name: Record source revision
        run: node scripts/write-web-build-marker.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy web demo
        id: deployment
        uses: actions/deploy-pages@v4
