name: Flutter mobile
on:
  push:
    branches: [main, flutter-mobile]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: flutter build apk --debug --flavor preview --no-pub
      - run: flutter build apk --release --flavor production --no-pub
      - run: flutter build apk --release --flavor preview --no-pub
      - name: Hash debug package
        run: sha256sum build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v6
        with:
          name: posey-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-preview-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: posey-android-release-unsigned
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign --no-pub
      - run: tar -czf posey-ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v6
        with:
          name: posey-ios-simulator
          path: mobile/posey-ios-simulator.tar.gz
          retention-days: 7
