name: Publish public demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --include=dev --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Build web showcase
        env:
          POSEY_PUBLIC_BUILD: "true"
          POSEY_PUBLIC_BASE: /Posey-web-demo/
        run: npm run build:web
      - name: Record source revision
        run: node scripts/write-web-build-marker.mjs
      - name: Configure demo deploy key
        env:
          DEMO_DEPLOY_KEY: ${{ secrets.POSEY_DEMO_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEMO_DEPLOY_KEY" > ~/.ssh/posey-demo
          chmod 600 ~/.ssh/posey-demo
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Publish built files only
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/posey-demo -o IdentitiesOnly=yes
        run: |
          git clone --depth 1 git@github.com:icelemon233/Posey-web-demo.git public-demo
          git -C public-demo rm -rf .
          cp -R dist/. public-demo/
          touch public-demo/.nojekyll
          git -C public-demo add --all
          if git -C public-demo diff --cached --quiet; then
            echo "Demo is already up to date."
            exit 0
          fi
          git -C public-demo config user.name "github-actions[bot]"
          git -C public-demo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public-demo commit -m "Deploy ${GITHUB_SHA::7}"
          git -C public-demo push origin main
